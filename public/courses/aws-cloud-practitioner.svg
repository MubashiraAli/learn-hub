<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1a3a"/>
      <stop offset="100%" stop-color="#1a3a6a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <!-- Cloud shapes -->
  <g opacity="0.12" fill="white">
    <ellipse cx="200" cy="180" rx="90" ry="40"/>
    <ellipse cx="160" cy="170" rx="60" ry="35"/>
    <ellipse cx="240" cy="170" rx="60" ry="35"/>
    <ellipse cx="550" cy="280" rx="100" ry="45"/>
    <ellipse cx="500" cy="268" rx="65" ry="38"/>
    <ellipse cx="600" cy="268" rx="65" ry="38"/>
  </g>
  <!-- Server rack lines -->
  <g opacity="0.1" stroke="#f97316" stroke-width="2" fill="none">
    <rect x="600" y="100" width="120" height="180" rx="6"/>
    <line x1="610" y1="130" x2="710" y2="130"/>
    <line x1="610" y1="160" x2="710" y2="160"/>
    <line x1="610" y1="190" x2="710" y2="190"/>
    <line x1="610" y1="220" x2="710" y2="220"/>
    <line x1="610" y1="250" x2="710" y2="250"/>
  </g>
  <!-- Accent dots -->
  <circle cx="120" cy="350" r="4" fill="#f97316" opacity="0.3"/>
  <circle cx="140" cy="350" r="4" fill="#f97316" opacity="0.2"/>
  <circle cx="160" cy="350" r="4" fill="#f97316" opacity="0.1"/>
</svg>